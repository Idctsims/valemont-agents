# The feed's source list. The worker syncs it into `sources` at boot:
# upsert by slug, never delete; a slug removed from this file goes
# active = false. Surveyed 2026-10-11 (docs/feed_sources.md).
#
#   kind = "rss"    url is the feed.
#   kind = "gnews"  query is a Google News search; the URL is built as
#                   news.google.com/rss/search?q=<query> when:<window>d, and
#                   each item's link is decoded to the publisher URL.
#   priority        lower wins the story lead when several outlets carry it.
#   pillars         "home", "sports", or both.
#   sport           cfb | nfl | nba | f1 | golf (sports sources), else omitted.
#   include_categories
#                   keep only items carrying one of these feed categories.
#   window_days     Google News window (default 2).

